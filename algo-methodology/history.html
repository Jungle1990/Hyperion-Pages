<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Great Ideas Timeline · 思想史时间线</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #0f1117; --card: #1a1d27; --card-hover: #222636; --accent: #6c63ff; --accent2: #ff6b6b; --accent3: #4ecdc4; --accent4: #ffe66d; --text: #e8e8f0; --text-dim: #8888a0; --border: #2a2d3a; --font-sans: 'Noto Sans SC', sans-serif; --font-mono: 'JetBrains Mono', monospace; --radius: 14px; }
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
body { font-family: var(--font-sans); background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
nav.fixed-nav { position: fixed; top:0; left:0; right:0; z-index:50; background: rgba(15,17,23,.75); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: .75rem 1.5rem; display: flex; align-items: center; gap: 1rem; font-size: .85rem; }
nav.fixed-nav a { color: var(--text-dim); text-decoration: none; } nav.fixed-nav a:hover { color: var(--accent); }
nav.fixed-nav .sep { color: var(--border); } nav.fixed-nav .crumb-current { color: var(--text); }

.hero { padding: 5rem 2rem 3rem; text-align: center; }
.hero-icon { font-size: 4rem; margin-bottom: 1rem; }
.hero h1 { font-size: 2.6rem; background: linear-gradient(135deg, var(--accent), var(--accent3)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: .4rem; }
.hero h2 { font-size: 1.3rem; color: var(--text-dim); font-weight: 300; }
.hero .intro { max-width: 720px; margin: 1.5rem auto 0; color: var(--text-dim); }

.timeline { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 4rem; position: relative; }
.timeline::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, var(--accent), var(--accent3), var(--accent4)); transform: translateX(-50%); }
.tl-item { position: relative; width: 50%; padding: 1rem 2rem; margin-bottom: .5rem; }
.tl-item.left { left: 0; text-align: right; }
.tl-item.right { left: 50%; }
.tl-dot { position: absolute; top: 1.6rem; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); box-shadow: 0 0 0 2px var(--accent); }
.tl-item.left .tl-dot { right: -7px; }
.tl-item.right .tl-dot { left: -7px; }
.tl-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem 1.4rem; transition: all .25s; cursor: pointer; }
.tl-card:hover { background: var(--card-hover); border-color: var(--accent); transform: scale(1.02); }
.tl-year { font-family: var(--font-mono); font-size: .85rem; color: var(--accent4); font-weight: 700; }
.tl-name { font-size: 1.1rem; font-weight: 600; margin: .25rem 0 .15rem; }
.tl-name-zh { font-size: .9rem; color: var(--text-dim); margin-bottom: .5rem; }
.tl-by { font-size: .8rem; color: var(--accent3); font-style: italic; margin-bottom: .6rem; }
.tl-idea { font-size: .9rem; color: var(--text); }
.tl-idea-zh { font-size: .85rem; color: var(--text-dim); margin-top: .3rem; opacity: .85; }
.tl-trivia { margin-top: .6rem; padding-top: .6rem; border-top: 1px dashed var(--border); font-size: .82rem; color: var(--text-dim); font-style: italic; }
.tl-srcs { margin-top: .5rem; }
.src-pill { display: inline-block; padding: .2rem .55rem; margin: .15rem .15rem 0 0; background: rgba(78,205,196,.08); border: 1px solid var(--accent3); color: var(--accent3); border-radius: 999px; font-size: .72rem; font-family: var(--font-mono); }

footer { padding: 3rem 1.5rem; text-align: center; color: var(--text-dim); font-size: .85rem; border-top: 1px solid var(--border); }
footer a { color: var(--accent3); text-decoration: none; }

@media (max-width: 720px) {
  .timeline::before { left: 20px; }
  .tl-item.left, .tl-item.right { left: 0; width: 100%; text-align: left; padding-left: 3rem; padding-right: 1rem; }
  .tl-item.left .tl-dot, .tl-item.right .tl-dot { left: 13px; right: auto; }
}
/* ── RGB triplet defaults (dark) ── */
:root {
  --bg-rgb: 15,17,23;
  --card-rgb: 26,29,39;
  --card-hover-rgb: 34,38,54;
  --text-rgb: 232,232,240;
  --text-dim-rgb: 136,136,160;
  --border-rgb: 42,45,58;
  --accent-rgb: 108,99,255;
  --accent2-rgb: 255,107,107;
  --accent3-rgb: 78,205,196;
  --accent4-rgb: 255,230,109;
  --bg-hero: #13151f;
  --code-bg: #12141c;
  --code-border: #1e2030;
}

/* ── Light theme overrides ── */
[data-theme="light"] {
  --bg: #f5f5f7;
  --card: #ffffff;
  --card-hover: #f0f0f5;
  --accent: #5b52e6;
  --accent2: #e55d5d;
  --accent3: #3cb8b0;
  --accent4: #c49800;
  --text: #1a1a2e;
  --text-dim: #6e6e82;
  --border: #dcdce5;
  --glow: rgba(91,82,230,0.10);
  --success: #059669;
  --warning: #b45309;
  --danger: #dc2626;

  --bg-rgb: 245,245,247;
  --card-rgb: 255,255,255;
  --card-hover-rgb: 240,240,245;
  --text-rgb: 26,26,46;
  --text-dim-rgb: 110,110,130;
  --border-rgb: 220,220,229;
  --accent-rgb: 91,82,230;
  --accent2-rgb: 229,93,93;
  --accent3-rgb: 60,184,176;
  --accent4-rgb: 196,152,0;
  --bg-hero: #e8e8ed;
  --code-bg: #f0f0f5;
  --code-border: #dcdce5;
}

</style>
</head>

  <p class="intro">Algorithms are a human story. Below: who invented what, and which book in the canon teaches it best today. 算法是一个人类故事——下面是谁发明了什么，以及今天哪本书讲得最好。</p>

<script>
window.__ideas__ = [
  {
    "id": "binary-search",
    "year": 1946,
    "name": "Binary Search",
    "nameZh": "二分查找",

    "idea": "Halve the search space each step — O(log N) is unbeatable for sorted lookup.",
    "ideaZh": "每步把搜索空间砍半——在有序查找中 O(log N) 不可超越。",

  {

    "by": "Edsger W. Dijkstra",
    "idea": "Greedy relaxation with a priority queue — invented over coffee in 20 minutes.",
    "ideaZh": "用优先队列做贪心松弛——据 Dijkstra 自述，咖啡桌上 20 分钟想出来的。",

    "id": "external-sort",

    "name": "External Sorting & I/O Model",

const root = document.getElementById('timeline');
function esc(s) { return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]); }
const items = (window.__ideas__||[]).slice().sort((a,b)=>a.year-b.year);
root.innerHTML = items.map((it,i)=>{
  const side = i%2===0 ? 'left' : 'right';
  const srcs = (it.sources||[]).map(s=>`<span class="src-pill">${esc(s.book)}</span>`).join('');
  return `<div class="tl-item ${side}">
    <div class="tl-dot"></div>
    <div class="tl-card">
      <div class="tl-year">${it.year}</div>
      <div class="tl-name">${esc(it.name)}</div>
      <div class="tl-name-zh">${esc(it.nameZh||'')}</div>
      <div class="tl-by">— ${esc(it.by||'')}</div>
      <div class="tl-idea">${esc(it.idea||'')}</div>
      <div class="tl-idea-zh">${esc(it.ideaZh||'')}</div>
      ${it.trivia ? `<div class="tl-trivia">💡 ${esc(it.trivia)}</div>` : ''}
      ${srcs ? `<div class="tl-srcs">${srcs}</div>` : ''}
    </div>
  </div>`;
}).join('');

<!-- Theme Toggle (injected into .fixed-nav) -->
<style>
.theme-toggle {
  margin-left: auto;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  transition: all 0.3s;
  opacity: 0.7;
  padding: 0;
  line-height: 1;
  flex-shrink: 0;
}
.theme-toggle:hover {
  opacity: 1;
  transform: scale(1.1);
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--glow);
}
</style>
<script>
(function() {
  var KEY = 'hyperion-theme';
  var toggle = document.getElementById('themeToggle');
  var icon = document.getElementById('themeIcon');

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    icon.textContent = theme === 'light' ? '\u{1F319}' : '\u{2600}\u{FE0F}';
    localStorage.setItem(KEY, theme);
    window.dispatchEvent(new CustomEvent('themechange', { detail: { theme: theme } }));
  }

  var saved = localStorage.getItem(KEY);
  if (saved) {
    applyTheme(saved);
  } else {
    icon.textContent = '\u{2600}\u{FE0F}';
  }

  toggle.addEventListener('click', function() {
    var current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'light' ? 'dark' : 'light');
  });

  // Utility for canvas code: read theme-aware CSS var values
  window.getThemeRGB = function(varName) {
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  };
})();
</script>
